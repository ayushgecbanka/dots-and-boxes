<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dots Battle - Online</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    background:
        radial-gradient(circle at 20% 20%,#283c86 0%,transparent 35%),
        radial-gradient(circle at 80% 30%,#512da8 0%,transparent 35%),
        linear-gradient(135deg,#080b18,#11182d 50%,#170d25);
}

.container{
    width:min(1200px,94%);
    margin:auto;
    padding:30px 0 60px;
}

header{
    text-align:center;
    margin-bottom:30px;
}

header h1{
    font-size:42px;
    letter-spacing:3px;
    background:linear-gradient(90deg,#00e5ff,#7c4dff,#ff4081);
    -webkit-background-clip:text;
    color:transparent;
}

header p{
    color:#aeb8d0;
    margin-top:8px;
}

.setup{
    display:grid;
    grid-template-columns:1fr 1.2fr 1fr;
    gap:20px;
    margin-bottom:25px;
}

.card{
    background:rgba(15,22,43,.88);
    border:1px solid #293555;
    border-radius:22px;
    padding:25px;
    box-shadow:0 15px 40px rgba(0,0,0,.3);
}

.card h2{
    text-align:center;
    margin-bottom:20px;
    font-size:20px;
}

.player-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.blue{
    color:#36d9ff;
}

.pink{
    color:#ff5ba7;
}

input{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:1px solid #33405f;
    background:#070d1d;
    color:white;
    outline:none;
    font-size:16px;
}

input:focus{
    border-color:#22d3ee;
}

.boards{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.board-btn{
    background:#080f20;
    border:1px solid #34415e;
    color:white;
    padding:18px 10px;
    border-radius:14px;
    cursor:pointer;
    font-size:17px;
    transition:.2s;
}

.board-btn:hover{
    border-color:#27d9ff;
    transform:translateY(-2px);
}

.board-btn.selected{
    border:2px solid #22d3ee;
    background:#15364b;
}

.online{
    background:rgba(10,17,35,.94);
    border:1px solid #293555;
    border-radius:22px;
    padding:25px;
    margin-bottom:25px;
}

.online h2{
    margin-bottom:8px;
}

.online p{
    color:#aeb8d0;
    margin-bottom:18px;
}

.online-row{
    display:flex;
    gap:12px;
}

button{
    border:none;
    cursor:pointer;
}

.primary{
    padding:15px 25px;
    border-radius:12px;
    color:white;
    font-weight:bold;
    font-size:15px;
    background:linear-gradient(90deg,#168cff,#d62cff);
}

.secondary{
    padding:15px 25px;
    border-radius:12px;
    color:white;
    font-weight:bold;
    background:#202b48;
}

.status{
    margin-top:15px;
    color:#ff5ba7;
    min-height:20px;
}

.game{
    display:none;
    background:rgba(8,14,30,.95);
    border:1px solid #293555;
    border-radius:24px;
    padding:25px;
}

.room{
    text-align:center;
    color:#26dcff;
    font-size:28px;
    font-weight:bold;
    margin-bottom:12px;
}

.turn{
    text-align:center;
    font-size:20px;
    margin-bottom:20px;
}

.players{
    display:flex;
    justify-content:center;
    gap:35px;
    margin-bottom:25px;
}

.score{
    font-size:20px;
    padding:10px 18px;
    border-radius:12px;
    background:#111a32;
}

.board-wrap{
    display:flex;
    justify-content:center;
    overflow:auto;
    padding:20px 0;
}

.game-board{
    display:grid;
    position:relative;
}

.dot{
    width:18px;
    height:18px;
    border-radius:50%;
    background:white;
    position:absolute;
    z-index:5;
    transform:translate(-50%,-50%);
    box-shadow:0 0 10px rgba(255,255,255,.6);
}

.line{
    position:absolute;
    background:#39435e;
    cursor:pointer;
    z-index:2;
    border-radius:10px;
    transition:.15s;
}

.line:hover{
    background:#596887;
}

.line.used{
    cursor:not-allowed;
}

.h-line{
    height:10px;
    transform:translateY(-50%);
}

.v-line{
    width:10px;
    transform:translateX(-50%);
}

.box{
    position:absolute;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    font-weight:bold;
    z-index:1;
    border-radius:8px;
}

.blue-box{
    background:rgba(0,180,255,.25);
    color:#32ddff;
}

.pink-box{
    background:rgba(255,60,140,.25);
    color:#ff5ba7;
}

.waiting{
    text-align:center;
    color:#9ca9c5;
    margin-top:15px;
}

.copy-btn{
    margin-left:8px;
    padding:8px 14px;
    border-radius:8px;
    background:#273452;
    color:white;
}

.restart{
    display:block;
    margin:20px auto 0;
}

@media(max-width:850px){
    .setup{
        grid-template-columns:1fr;
    }

    .online-row{
        flex-direction:column;
    }

    .players{
        gap:10px;
        flex-direction:column;
        align-items:center;
    }

    header h1{
        font-size:30px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>DOTS BATTLE</h1>
    <p>Classic strategy. Modern battle.</p>
</header>

<div id="setupSection">

<div class="setup">

<div class="card">
    <div class="player-title blue">🔵 PLAYER 1</div>
    <input id="p1Name" placeholder="Your name">
</div>

<div class="card">
    <h2>SELECT BOARD</h2>

    <div class="boards">
        <button class="board-btn" data-size="3">
            <b>3 × 3</b><br>
            <small>4 boxes</small>
        </button>

        <button class="board-btn selected" data-size="4">
            <b>4 × 4</b><br>
            <small>9 boxes</small>
        </button>

        <button class="board-btn" data-size="5">
            <b>5 × 5</b><br>
            <small>16 boxes</small>
        </button>

        <button class="board-btn" data-size="6">
            <b>6 × 6</b><br>
            <small>25 boxes</small>
        </button>
    </div>
</div>

<div class="card">
    <div class="player-title pink">💗 PLAYER 2</div>
    <input id="p2Name" placeholder="Friend's name">
</div>

</div>

<div class="online">

<h2>🌐 Play Online</h2>
<p>Create a private room and send the room code to your friend.</p>

<div class="online-row">
    <button class="primary" id="createBtn">CREATE ROOM →</button>

    <input id="roomInput" placeholder="ROOM CODE">

    <button class="secondary" id="joinBtn">JOIN</button>
</div>

<div class="status" id="status"></div>

</div>

</div>

<div class="game" id="gameSection">

<div class="room">
    ROOM: <span id="roomCode"></span>
    <button class="copy-btn" id="copyBtn">COPY</button>
</div>

<div class="turn" id="turnText"></div>

<div class="players">
    <div class="score blue">
        🔵 <span id="player1Display">Player 1</span> :
        <span id="score1">0</span>
    </div>

    <div class="score pink">
        💗 <span id="player2Display">Player 2</span> :
        <span id="score2">0</span>
    </div>
</div>

<div class="board-wrap">
    <div class="game-board" id="gameBoard"></div>
</div>

<div class="waiting" id="waitingText"></div>

<button class="primary restart" id="newGameBtn">
    NEW GAME
</button>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.7.1/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    onValue,
    runTransaction
}
from "https://www.gstatic.com/firebasejs/12.7.1/firebase-database.js";


/* ================= FIREBASE ================= */

const firebaseConfig = {
    apiKey: "AIzaSySDyBcTvTDmMOMIhmKwx8x57QvGNWWhYlpx8",
    authDomain: "dots-and-boxes-60439.firebaseapp.com",
    databaseURL: "https://dots-and-boxes-60439-default-rtdb.firebaseio.com",
    projectId: "dots-and-boxes-60439",
    storageBucket: "dots-and-boxes-60439.firebasestorage.app",
    messagingSenderId: "435400230088",
    appId: "1:435400230088:web:834195f25c120b698911fd",
    measurementId: "G-RLJ2ZQ08T0"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


/* ================= VARIABLES ================= */

let selectedSize = 4;
let roomCode = "";
let myPlayer = 0;
let currentGame = null;
let unsubscribe = null;


/* ================= BOARD SELECT ================= */

document.querySelectorAll(".board-btn").forEach(btn => {

    btn.addEventListener("click", () => {

        if(roomCode) return;

        document.querySelectorAll(".board-btn")
        .forEach(x => x.classList.remove("selected"));

        btn.classList.add("selected");

        selectedSize = Number(btn.dataset.size);

    });

});


/* ================= RANDOM ROOM ================= */

function generateRoom(){

    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "";

    for(let i=0;i<6;i++){
        code += chars[Math.floor(Math.random()*chars.length)];
    }

    return code;
}


/* ================= CREATE ROOM ================= */

document.getElementById("createBtn").onclick = async () => {

    const name = document.getElementById("p1Name").value.trim();

    if(!name){
        alert("Pehle apna naam likho.");
        return;
    }

    roomCode = generateRoom();
    myPlayer = 1;

    const game = {
        size:selectedSize,

        players:{
            p1:{
                name:name,
                score:0
            },
            p2:{
                name:"",
                score:0
            }
        },

        turn:1,

        lines:{},

        boxes:{},

        started:false,

        finished:false
    };

    try{

        await set(
            ref(db,"rooms/"+roomCode),
            game
        );

        document.getElementById("status").innerText =
            "Room created: "+roomCode;

        listenRoom();

    }catch(error){

        console.error(error);

        document.getElementById("status").innerText =
            "Firebase error: "+error.message;

    }

};


/* ================= JOIN ROOM ================= */

document.getElementById("joinBtn").onclick = async () => {

    const code =
        document.getElementById("roomInput").value
        .trim()
        .toUpperCase();

    const name =
        document.getElementById("p2Name").value.trim();

    if(!name){
        alert("Friend ka naam likho.");
        return;
    }

    if(!code){
        alert("Room code daalo.");
        return;
    }

    roomCode = code;
    myPlayer = 2;

    const roomRef = ref(db,"rooms/"+roomCode);

    onValue(roomRef, async snap => {

        if(!snap.exists()){

            document.getElementById("status").innerText =
                "Room nahi mila.";

            return;
        }

        const data = snap.val();

        if(data.players.p2 && data.players.p2.name){

            if(data.players.p2.name !== name){

                document.getElementById("status").innerText =
                    "Room already full.";

                return;
            }

        }else{

            await runTransaction(roomRef,current => {

                if(!current) return current;

                if(current.players.p2.name) return;

                current.players.p2.name = name;
                current.started = true;

                return current;

            });

        }

        listenRoom();

    },{onlyOnce:true});

};


/* ================= LISTEN ROOM ================= */

function listenRoom(){

    if(unsubscribe){
        unsubscribe();
    }

    const roomRef = ref(db,"rooms/"+roomCode);

    unsubscribe = onValue(roomRef,snap => {

        if(!snap.exists()){

            document.getElementById("status").innerText =
                "Room deleted.";

            return;
        }

        currentGame = snap.val();

        renderGame();

    });

}


/* ================= RENDER GAME ================= */

function renderGame(){

    const game = currentGame;

    document.getElementById("setupSection").style.display = "none";

    document.getElementById("gameSection").style.display = "block";

    document.getElementById("roomCode").innerText = roomCode;

    document.getElementById("player1Display").innerText =
        game.players.p1.name || "Player 1";

    document.getElementById("player2Display").innerText =
        game.players.p2.name || "Waiting...";

    document.getElementById("score1").innerText =
        game.players.p1.score || 0;

    document.getElementById("score2").innerText =
        game.players.p2.score || 0;


    if(!game.players.p2.name){

        document.getElementById("turnText").innerText =
            "Waiting for Player 2...";

        document.getElementById("waitingText").innerText =
            "Room code share karo: "+roomCode;

    }else{

        const turnPlayer = game.turn;

        const turnName =
            turnPlayer === 1
            ? game.players.p1.name
            : game.players.p2.name;

        if(turnPlayer === myPlayer){

            document.getElementById("turnText").innerText =
                "🟢 YOUR TURN — "+turnName;

        }else{

            document.getElementById("turnText").innerText =
                "🔴 "+turnName+"'S TURN";

        }

        document.getElementById("waitingText").innerText = "";

    }

    drawBoard();

}


/* ================= DRAW BOARD ================= */

function drawBoard(){

    const game = currentGame;

    const size = Number(game.size);

    const board = document.getElementById("gameBoard");

    board.innerHTML = "";

    const cell = Math.min(
        100,
        Math.max(65,700/(size-1))
    );

    const width = (size-1)*cell;
    const height = width;

    board.style.width = width+"px";
    board.style.height = height+"px";


    /* DOTS */

    for(let r=0;r<size;r++){

        for(let c=0;c<size;c++){

            const dot = document.createElement("div");

            dot.className = "dot";

            dot.style.left = (c*cell)+"px";
            dot.style.top = (r*cell)+"px";

            board.appendChild(dot);

        }

    }


    /* HORIZONTAL LINES */

    for(let r=0;r<size;r++){

        for(let c=0;c<size-1;c++){

            const key = "h_"+r+"_"+c;

            const line = document.createElement("div");

            line.className = "line h-line";

            line.style.left = (c*cell)+"px";
            line.style.top = (r*cell)+"px";
            line.style.width = cell+"px";

            if(game.lines && game.lines[key]){

                line.classList.add("used");

                line.style.background =
                    game.lines[key] === 1
                    ? "#22d3ee"
                    : "#ff4fa3";

            }else{

                line.onclick = () => makeMove(key);

            }

            board.appendChild(line);

        }

    }


    /* VERTICAL LINES */

    for(let r=0;r<size-1;r++){

        for(let c=0;c<size;c++){

            const key = "v_"+r+"_"+c;

            const line = document.createElement("div");

            line.className = "line v-line";

            line.style.left = (c*cell)+"px";
            line.style.top = (r*cell)+"px";
            line.style.height = cell+"px";

            if(game.lines && game.lines[key]){

                line.classList.add("used");

                line.style.background =
                    game.lines[key] === 1
                    ? "#22d3ee"
                    : "#ff4fa3";

            }else{

                line.onclick = () => makeMove(key);

            }

            board.appendChild(line);

        }

    }


    /* BOXES */

    if(game.boxes){

        Object.keys(game.boxes).forEach(key => {

            const parts = key.split("_");

            const r = Number(parts[1]);
            const c = Number(parts[2]);

            const box = document.createElement("div");

            box.className =
                "box "+
                (game.boxes[key] === 1
                ? "blue-box"
                : "pink-box");

            box.style.left =
                (c*cell+7)+"px";

            box.style.top =
                (r*cell+7)+"px";

            box.style.width =
                (cell-14)+"px";

            box.style.height =
                (cell-14)+"px";

            box.innerText =
                game.boxes[key] === 1
                ? "🔵"
                : "💗";

            board.appendChild(box);

        });

    }

}


/* ================= MAKE MOVE ================= */

async function makeMove(lineKey){

    if(!currentGame) return;

    if(!currentGame.players.p2.name) return;

    /*
       IMPORTANT:

       Sirf current turn wala player move kar sakta hai.
       Ye check local UI ke liye hai.
       Final check Firebase transaction ke andar bhi hai.
    */

    if(Number(currentGame.turn) !== Number(myPlayer)){

        return;

    }

    if(currentGame.lines && currentGame.lines[lineKey]){

        return;

    }


    const roomRef = ref(db,"rooms/"+roomCode);


    await runTransaction(roomRef,current => {

        if(!current) return current;

        /* PLAYER TURN CHECK */

        if(Number(current.turn) !== Number(myPlayer)){

            return;

        }


        /* LINE ALREADY USED */

        if(current.lines && current.lines[lineKey]){

            return;

        }


        if(!current.lines){
            current.lines = {};
        }

        if(!current.boxes){
            current.boxes = {};
        }


        /* ADD LINE */

        current.lines[lineKey] = myPlayer;


        /*
           Check completed boxes
        */

        const size = Number(current.size);

        let completed = 0;


        /* Check every box */

        for(let r=0;r<size-1;r++){

            for(let c=0;c<size-1;c++){

                const boxKey = "b_"+r+"_"+c;

                if(current.boxes[boxKey]) continue;


                const top =
                    "h_"+r+"_"+c;

                const bottom =
                    "h_"+(r+1)+"_"+c;

                const left =
                    "v_"+r+"_"+c;

                const right =
                    "v_"+r+"_"+(c+1);


                if(
                    current.lines[top] &&
                    current.lines[bottom] &&
                    current.lines[left] &&
                    current.lines[right]
                ){

                    current.boxes[boxKey] = myPlayer;

                    current.players[
                        "p"+myPlayer
                    ].score =
                        Number(
                            current.players[
                                "p"+myPlayer
                            ].score || 0
                        ) + 1;

                    completed++;

                }

            }

        }


        /*
           IMPORTANT GAME LOGIC:

           Box banaya -> same player ka turn rahega.

           Box nahi banaya -> turn opponent ko jayega.
        */

        if(completed === 0){

            current.turn =
                myPlayer === 1 ? 2 : 1;

        }else{

            current.turn = myPlayer;

        }


        /* GAME FINISHED */

        const totalBoxes =
            (size-1)*(size-1);

        const boxCount =
            current.boxes
            ? Object.keys(current.boxes).length
            : 0;

        if(boxCount >= totalBoxes){

            current.finished = true;

            current.turn = 0;

        }


        return current;

    });

}


/* ================= COPY ROOM ================= */

document.getElementById("copyBtn").onclick = async () => {

    try{

        await navigator.clipboard.writeText(roomCode);

        document.getElementById("copyBtn").innerText =
            "COPIED!";

        setTimeout(() => {

            document.getElementById("copyBtn").innerText =
                "COPY";

        },1500);

    }catch(e){

        alert("Room Code: "+roomCode);

    }

};


/* ================= NEW GAME ================= */

document.getElementById("newGameBtn").onclick = async () => {

    if(!roomCode) return;

    if(myPlayer !== 1){

        alert("Sirf Player 1 new game start kar sakta hai.");

        return;

    }

    const roomRef = ref(db,"rooms/"+roomCode);

    await runTransaction(roomRef,current => {

        if(!current) return current;

        current.turn = 1;

        current.lines = {};

        current.boxes = {};

        current.finished = false;

        current.players.p1.score = 0;
        current.players.p2.score = 0;

        return current;

    });

};

</script>

</body>
</html>

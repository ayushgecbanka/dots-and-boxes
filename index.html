<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dots Battle - Online</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    color:white;
    background:
        radial-gradient(circle at 20% 20%, #263c68 0%, transparent 35%),
        radial-gradient(circle at 80% 10%, #692c5b 0%, transparent 35%),
        linear-gradient(135deg,#090d1d,#151a32,#241328);
}

.container{
    width:95%;
    max-width:1100px;
    margin:auto;
    padding:25px 0 50px;
}

header{
    text-align:center;
    margin-bottom:25px;
}

header h1{
    font-size:42px;
    letter-spacing:2px;
    background:linear-gradient(90deg,#00d9ff,#ff4db8);
    -webkit-background-clip:text;
    color:transparent;
}

header p{
    color:#aeb6d0;
    margin-top:7px;
}

.card{
    background:rgba(13,19,40,.92);
    border:1px solid #293451;
    border-radius:22px;
    padding:25px;
    margin-bottom:20px;
    box-shadow:0 15px 45px rgba(0,0,0,.3);
}

.setup{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:20px;
}

.player h2{
    margin-bottom:15px;
    font-size:20px;
}

.p1 h2{color:#22d9ff;}
.p2 h2{color:#ff5cb8;}

input{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:1px solid #34405e;
    background:#080d1e;
    color:white;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#00d9ff;
}

.boards{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.board-btn{
    padding:18px 10px;
    background:#080d1e;
    border:1px solid #34405e;
    color:white;
    border-radius:14px;
    cursor:pointer;
    font-size:17px;
    transition:.2s;
}

.board-btn:hover{
    border-color:#00d9ff;
    transform:translateY(-2px);
}

.board-btn.active{
    background:#163c51;
    border:2px solid #00d9ff;
}

.board-btn small{
    display:block;
    color:#9ca8c5;
    margin-top:5px;
}

.online h2{
    margin-bottom:10px;
}

.online p{
    color:#9ca8c5;
    margin-bottom:15px;
}

.online-row{
    display:flex;
    gap:12px;
}

button{
    border:none;
    cursor:pointer;
    color:white;
    font-weight:bold;
}

.create{
    min-width:190px;
    border-radius:12px;
    background:linear-gradient(90deg,#148cff,#d72db4);
    font-size:16px;
}

.join{
    width:100px;
    border-radius:12px;
    background:#293654;
    font-size:16px;
}

.status{
    margin-top:14px;
    color:#ff5eb8;
    min-height:20px;
}

.game{
    display:none;
}

.room{
    text-align:center;
    margin-bottom:20px;
}

.room h2{
    color:#00d9ff;
    letter-spacing:1px;
}

.turn{
    text-align:center;
    padding:15px;
    border-radius:15px;
    background:#080d1e;
    margin-bottom:20px;
    font-size:20px;
}

.players{
    display:flex;
    justify-content:center;
    gap:40px;
    margin-bottom:25px;
}

.score{
    font-size:19px;
}

.blue{
    color:#36d9ff;
}

.pink{
    color:#ff5eb8;
}

.board-wrap{
    display:flex;
    justify-content:center;
    overflow:auto;
    padding:20px 5px;
}

.board{
    position:relative;
    display:grid;
    user-select:none;
    touch-action:none;
}

.dot{
    position:absolute;
    width:18px;
    height:18px;
    border-radius:50%;
    background:white;
    transform:translate(-50%,-50%);
    z-index:5;
    box-shadow:0 0 12px rgba(255,255,255,.5);
}

.line{
    position:absolute;
    background:#34405e;
    cursor:pointer;
    z-index:2;
    transition:.15s;
}

.line:hover{
    background:#00d9ff;
}

.line.horizontal{
    height:9px;
    border-radius:10px;
}

.line.vertical{
    width:9px;
    border-radius:10px;
}

.line.p1{
    background:#20d9ff;
    box-shadow:0 0 12px rgba(32,217,255,.5);
}

.line.p2{
    background:#ff4db8;
    box-shadow:0 0 12px rgba(255,77,184,.5);
}

.box{
    position:absolute;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
    font-weight:bold;
    border-radius:8px;
    z-index:1;
}

.box.p1{
    background:rgba(32,217,255,.14);
    color:#20d9ff;
}

.box.p2{
    background:rgba(255,77,184,.14);
    color:#ff4db8;
}

.copy{
    margin-top:15px;
    padding:11px 20px;
    background:#263653;
    border-radius:10px;
}

.newgame{
    display:block;
    margin:20px auto 0;
    padding:14px 25px;
    background:linear-gradient(90deg,#148cff,#d72db4);
    border-radius:12px;
}

.winner{
    text-align:center;
    font-size:25px;
    margin-top:20px;
    color:#ffd35c;
}

@media(max-width:800px){
    .setup{
        grid-template-columns:1fr;
    }

    .players{
        gap:20px;
    }

    header h1{
        font-size:32px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>DOTS BATTLE</h1>
    <p>Classic strategy. Modern battle.</p>
</header>

<div id="setupScreen">

<div class="card setup">

<div class="player p1">
    <h2>🔵 PLAYER 1</h2>
    <input id="player1Name" placeholder="Your name">
</div>

<div>
    <h2 style="margin-bottom:15px;text-align:center;">SELECT BOARD</h2>

    <div class="boards">

        <button class="board-btn" data-size="3">
            <b>3 × 3</b>
            <small>9 boxes</small>
        </button>

        <button class="board-btn active" data-size="4">
            <b>4 × 4</b>
            <small>16 boxes</small>
        </button>

        <button class="board-btn" data-size="5">
            <b>5 × 5</b>
            <small>25 boxes</small>
        </button>

        <button class="board-btn" data-size="6">
            <b>6 × 6</b>
            <small>36 boxes</small>
        </button>

    </div>
</div>

<div class="player p2">
    <h2>💗 PLAYER 2</h2>
    <input id="player2Name" placeholder="Friend's name">
</div>

</div>

<div class="card online">

<h2>🌐 Play Online</h2>

<p>Create a private room and send the room code to your friend.</p>

<div class="online-row">

<button class="create" id="createRoom">
    CREATE ROOM →
</button>

<input id="roomCode" placeholder="ROOM CODE">

<button class="join" id="joinRoom">
    JOIN
</button>

</div>

<div class="status" id="status"></div>

</div>

</div>


<div class="card game" id="gameScreen">

<div class="room">
    <h2>ROOM: <span id="roomDisplay"></span></h2>
    <button class="copy" id="copyRoom">COPY ROOM CODE</button>
</div>

<div class="turn" id="turnText">
    Waiting...
</div>

<div class="players">

<div class="score blue">
    🔵 <span id="p1Display">Player 1</span> :
    <span id="p1Score">0</span>
</div>

<div class="score pink">
    💗 <span id="p2Display">Player 2</span> :
    <span id="p2Score">0</span>
</div>

</div>

<div class="board-wrap">
    <div class="board" id="board"></div>
</div>

<div class="winner" id="winner"></div>

<button class="newgame" id="backButton">
    BACK TO HOME
</button>

</div>

</div>


<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.7.1/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    get,
    onValue,
    runTransaction
} from
"https://www.gstatic.com/firebasejs/12.7.1/firebase-database.js";


/* ================= FIREBASE ================= */

const firebaseConfig = {

    apiKey: "AIzaSyDBcTvTDmM0MIhmKwx8x57QvGNWhY1px8",

    authDomain:
    "dots-and-boxes-60439.firebaseapp.com",

    databaseURL:
    "https://dots-and-boxes-60439-default-rtdb.firebaseio.com",

    projectId:
    "dots-and-boxes-60439",

    storageBucket:
    "dots-and-boxes-60439.firebasestorage.app",

    messagingSenderId:
    "435400230088",

    appId:
    "1:435400230088:web:834195f25c120b698911fd",

    measurementId:
    "G-RLJ2ZQ08T0"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


/* ================= VARIABLES ================= */

let selectedSize = 4;
let roomId = "";
let myPlayer = "";
let unsubscribe = null;


/* ================= ELEMENTS ================= */

const setupScreen =
document.getElementById("setupScreen");

const gameScreen =
document.getElementById("gameScreen");

const statusText =
document.getElementById("status");

const board =
document.getElementById("board");

const turnText =
document.getElementById("turnText");

const p1Display =
document.getElementById("p1Display");

const p2Display =
document.getElementById("p2Display");

const p1Score =
document.getElementById("p1Score");

const p2Score =
document.getElementById("p2Score");

const winner =
document.getElementById("winner");


/* ================= BOARD SELECT ================= */

document.querySelectorAll(".board-btn").forEach(btn => {

    btn.addEventListener("click", () => {

        document
        .querySelectorAll(".board-btn")
        .forEach(b => b.classList.remove("active"));

        btn.classList.add("active");

        selectedSize =
        Number(btn.dataset.size);

    });

});


/* ================= CREATE ROOM ================= */

document
.getElementById("createRoom")
.addEventListener("click", async () => {

    const name =
    document.getElementById("player1Name")
    .value.trim();

    if(!name){
        statusText.textContent =
        "Pehle apna naam enter karo.";
        return;
    }

    roomId =
    Math.random()
    .toString(36)
    .substring(2,8)
    .toUpperCase();

    myPlayer = "p1";

    const roomData = {

        size: selectedSize,

        players: {
            p1: name,
            p2: ""
        },

        scores: {
            p1: 0,
            p2: 0
        },

        turn: "p1",

        lines: {},

        boxes: {},

        finished: false

    };

    try{

        await set(
            ref(db, "rooms/" + roomId),
            roomData
        );

        openGame();

        listenRoom();

    }catch(error){

        console.error(error);

        statusText.textContent =
        "Room create nahi hua. Firebase Rules check karo.";

    }

});


/* ================= JOIN ROOM ================= */

document
.getElementById("joinRoom")
.addEventListener("click", async () => {

    const code =
    document.getElementById("roomCode")
    .value
    .trim()
    .toUpperCase();

    const name =
    document.getElementById("player2Name")
    .value
    .trim();

    if(!code){

        statusText.textContent =
        "Room code enter karo.";

        return;
    }

    if(!name){

        statusText.textContent =
        "Friend ka naam enter karo.";

        return;
    }

    try{

        const snapshot =
        await get(
            ref(db, "rooms/" + code)
        );

        if(!snapshot.exists()){

            statusText.textContent =
            "Room nahi mila.";

            return;
        }

        const room =
        snapshot.val();

        if(room.players.p2){

            statusText.textContent =
            "Room already full hai.";

            return;
        }

        roomId = code;

        myPlayer = "p2";

        await set(
            ref(
                db,
                "rooms/" +
                roomId +
                "/players/p2"
            ),
            name
        );

        openGame();

        listenRoom();

    }catch(error){

        console.error(error);

        statusText.textContent =
        "Join karne me problem hui.";

    }

});


/* ================= OPEN GAME ================= */

function openGame(){

    setupScreen.style.display = "none";

    gameScreen.style.display = "block";

    document
    .getElementById("roomDisplay")
    .textContent = roomId;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* ================= LISTEN FIREBASE ================= */

function listenRoom(){

    if(unsubscribe){
        unsubscribe();
    }

    const roomRef =
    ref(db, "rooms/" + roomId);

    unsubscribe =
    onValue(roomRef, snapshot => {

        if(!snapshot.exists()){

            statusText.textContent =
            "Room delete ho gaya.";

            return;
        }

        const room =
        snapshot.val();

        renderGame(room);

    });

}


/* ================= RENDER GAME ================= */

function renderGame(room){

    p1Display.textContent =
    room.players?.p1 || "Player 1";

    p2Display.textContent =
    room.players?.p2 || "Waiting...";

    p1Score.textContent =
    room.scores?.p1 || 0;

    p2Score.textContent =
    room.scores?.p2 || 0;


    if(!room.players?.p2){

        turnText.textContent =
        "💗 Waiting for Player 2...";

    }else{

        if(room.turn === myPlayer){

            turnText.textContent =
            "🔥 YOUR TURN";

        }else{

            const name =
            room.turn === "p1"
            ? room.players.p1
            : room.players.p2;

            turnText.textContent =
            "⏳ " + name + "'s TURN";

        }

    }


    drawBoard(room);

    if(room.finished){

        if(room.scores.p1 >
           room.scores.p2){

            winner.textContent =
            "🏆 " +
            room.players.p1 +
            " WINS!";

        }else if(room.scores.p2 >
                 room.scores.p1){

            winner.textContent =
            "🏆 " +
            room.players.p2 +
            " WINS!";

        }else{

            winner.textContent =
            "🤝 DRAW!";

        }

    }else{

        winner.textContent = "";

    }

}


/* ================= DRAW BOARD ================= */

function drawBoard(room){

    board.innerHTML = "";

    const n =
    Number(room.size);

    const points =
    n + 1;

    const boardPixel =
    Math.min(
        600,
        window.innerWidth - 60
    );

    const gap =
    boardPixel / n;

    board.style.width =
    boardPixel + "px";

    board.style.height =
    boardPixel + "px";


    /* ===== BOXES ===== */

    for(let r=0;r<n;r++){

        for(let c=0;c<n;c++){

            const key =
            r + "_" + c;

            const owner =
            room.boxes?.[key];

            if(owner){

                const box =
                document.createElement("div");

                box.className =
                "box " + owner;

                box.style.left =
                (c * gap + 8) + "px";

                box.style.top =
                (r * gap + 8) + "px";

                box.style.width =
                (gap - 16) + "px";

                box.style.height =
                (gap - 16) + "px";

                box.textContent =
                owner === "p1"
                ? "🔵"
                : "💗";

                board.appendChild(box);

            }

        }

    }


    /* ===== HORIZONTAL LINES ===== */

    for(let r=0;r<points;r++){

        for(let c=0;c<n;c++){

            const key =
            "h_" + r + "_" + c;

            const line =
            document.createElement("div");

            line.className =
            "line horizontal";

            line.style.left =
            (c * gap + 4) + "px";

            line.style.top =
            (r * gap - 4) + "px";

            line.style.width =
            (gap - 8) + "px";

            if(room.lines?.[key]){

                line.classList.add(
                    room.lines[key]
                );

            }else{

                line.addEventListener(
                    "click",
                    () => makeMove(key)
                );

            }

            board.appendChild(line);

        }

    }


    /* ===== VERTICAL LINES ===== */

    for(let r=0;r<n;r++){

        for(let c=0;c<points;c++){

            const key =
            "v_" + r + "_" + c;

            const line =
            document.createElement("div");

            line.className =
            "line vertical";

            line.style.left =
            (c * gap - 4) + "px";

            line.style.top =
            (r * gap + 4) + "px";

            line.style.height =
            (gap - 8) + "px";

            if(room.lines?.[key]){

                line.classList.add(
                    room.lines[key]
                );

            }else{

                line.addEventListener(
                    "click",
                    () => makeMove(key)
                );

            }

            board.appendChild(line);

        }

    }


    /* ===== DOTS ===== */

    for(let r=0;r<points;r++){

        for(let c=0;c<points;c++){

            const dot =
            document.createElement("div");

            dot.className = "dot";

            dot.style.left =
            (c * gap) + "px";

            dot.style.top =
            (r * gap) + "px";

            board.appendChild(dot);

        }

    }

}


/* ================= MAKE MOVE ================= */

async function makeMove(key){

    const roomRef =
    ref(db, "rooms/" + roomId);

    try{

        await runTransaction(
            roomRef,
            room => {

                if(!room){
                    return room;
                }

                /* Player 2 not joined */
                if(!room.players?.p2){
                    return;
                }

                /* Game finished */
                if(room.finished){
                    return;
                }

                /* NOT MY TURN */
                if(room.turn !== myPlayer){
                    return;
                }

                /* LINE ALREADY USED */
                if(room.lines?.[key]){
                    return;
                }

                if(!room.lines){
                    room.lines = {};
                }

                if(!room.boxes){
                    room.boxes = {};
                }

                if(!room.scores){
                    room.scores = {
                        p1:0,
                        p2:0
                    };
                }


                /* DRAW LINE */

                room.lines[key] =
                myPlayer;


                let completed = 0;


                /* CHECK ALL BOXES */

                const n =
                Number(room.size);

                for(let r=0;r<n;r++){

                    for(let c=0;c<n;c++){

                        const boxKey =
                        r + "_" + c;

                        if(room.boxes[boxKey]){
                            continue;
                        }


                        const top =
                        "h_" + r + "_" + c;

                        const bottom =
                        "h_" + (r+1) + "_" + c;

                        const left =
                        "v_" + r + "_" + c;

                        const right =
                        "v_" + r + "_" + (c+1);


                        if(
                            room.lines[top] &&
                            room.lines[bottom] &&
                            room.lines[left] &&
                            room.lines[right]
                        ){

                            room.boxes[boxKey] =
                            myPlayer;

                            room.scores[myPlayer]++;

                            completed++;

                        }

                    }

                }


                /* COUNT BOXES */

                let totalBoxes = 0;

                if(room.boxes){

                    totalBoxes =
                    Object.keys(room.boxes).length;

                }


                /* GAME FINISHED */

                if(
                    totalBoxes >=
                    n * n
                ){

                    room.finished = true;

                }


                /*
                 * IMPORTANT:
                 * Box bana -> SAME PLAYER
                 * Box nahi bana -> TURN CHANGE
                 */

                if(
                    completed === 0 &&
                    !room.finished
                ){

                    room.turn =
                    myPlayer === "p1"
                    ? "p2"
                    : "p1";

                }


                return room;

            }
        );

    }catch(error){

        console.error(
            "Move error:",
            error
        );

    }

}


/* ================= COPY ROOM ================= */

document
.getElementById("copyRoom")
.addEventListener("click", async () => {

    try{

        await navigator.clipboard.writeText(roomId);

        document
        .getElementById("copyRoom")
        .textContent =
        "COPIED ✓";

        setTimeout(() => {

            document
            .getElementById("copyRoom")
            .textContent =
            "COPY ROOM CODE";

        },1500);

    }catch(error){

        alert(
            "Room Code: " + roomId
        );

    }

});


/* ================= BACK ================= */

document
.getElementById("backButton")
.addEventListener("click", () => {

    if(unsubscribe){
        unsubscribe();
    }

    location.reload();

});

</script>

</body>
</html>

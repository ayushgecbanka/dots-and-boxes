<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Dots Battle</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:#fff;

    background:
    radial-gradient(circle at 15% 20%,rgba(0,210,255,.25),transparent 30%),
    radial-gradient(circle at 85% 25%,rgba(255,50,170,.25),transparent 30%),
    radial-gradient(circle at 50% 90%,rgba(100,60,255,.22),transparent 35%),
    linear-gradient(135deg,#050817,#111a38,#17091f);

    padding:25px;
}

.container{
    width:min(1050px,100%);
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    margin:0;
    font-size:42px;
    letter-spacing:3px;

    background:linear-gradient(
        90deg,
        #18d9ff,
        #806cff,
        #ff4cae
    );

    -webkit-background-clip:text;
    color:transparent;
}

.header p{
    color:#aab5d1;
    margin-top:8px;
}


/* ================= SETUP ================= */

.setup{
    display:grid;
    grid-template-columns:1fr 1.3fr 1fr;
    gap:18px;
}

.card{
    background:rgba(10,17,39,.90);
    border:1px solid #2b385b;
    border-radius:20px;
    padding:22px;
    box-shadow:0 15px 45px rgba(0,0,0,.35);
}

.card h2{
    text-align:center;
    margin-top:0;
    font-size:19px;
}

.player1 h2{
    color:#20d9ff;
}

.player2 h2{
    color:#ff58b2;
}

input{
    width:100%;
    padding:14px;
    margin-top:10px;

    border-radius:11px;
    border:1px solid #354263;

    background:#070d20;
    color:#fff;

    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#20d9ff;
}


/* ================= BOARD SELECT ================= */

.board-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
}

.size-btn{
    width:100%;
    padding:15px 5px;

    border:2px solid #303c5b;
    border-radius:13px;

    background:#080e20;
    color:#fff;

    cursor:pointer;

    font-size:16px;
    font-weight:bold;

    transition:.2s;
}

.size-btn:hover{
    border-color:#20d9ff;
    transform:translateY(-2px);
}

.size-btn.selected{
    border-color:#20d9ff;
    background:linear-gradient(
        135deg,
        #123b50,
        #20254b
    );

    box-shadow:
    0 0 18px rgba(32,217,255,.20);
}

.size-btn small{
    display:block;
    margin-top:5px;
    color:#aab5d1;
}


/* ================= ONLINE ================= */

.online{
    margin-top:18px;
}

.online h2{
    margin-bottom:8px;
}

.online p{
    color:#aab5d1;
    margin-bottom:18px;
}

.online-row{
    display:grid;
    grid-template-columns:auto 1fr auto;
    gap:10px;
}

.btn{
    border:0;
    border-radius:11px;
    padding:14px 20px;

    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.create-btn{
    background:
    linear-gradient(
        90deg,
        #078cff,
        #d52cb5
    );
}

.join-btn{
    background:#273452;
}

.status{
    margin-top:14px;
    min-height:20px;
    color:#ff63b5;
}


/* ================= GAME ================= */

.game{
    display:none;
}

.game-header{
    background:rgba(10,17,39,.92);
    border:1px solid #2b385b;
    border-radius:20px;
    padding:18px;

    box-shadow:0 15px 45px rgba(0,0,0,.35);
}

.room{
    text-align:center;
    color:#20d9ff;
    font-size:18px;
    font-weight:bold;
}

.turn{
    text-align:center;
    margin-top:12px;

    padding:12px;

    border-radius:12px;
    background:#070d20;

    font-size:18px;
    font-weight:bold;
}

.players{
    display:flex;
    justify-content:center;
    gap:25px;
    margin-top:15px;
    flex-wrap:wrap;
}

.player-score{
    padding:10px 18px;
    border-radius:12px;
    background:#101a34;
    font-weight:bold;
}

.p1-score{
    color:#20d9ff;
}

.p2-score{
    color:#ff58b2;
}


/* ================= GAME BOARD ================= */

.board-area{
    display:flex;
    justify-content:center;
    margin-top:25px;
    overflow:auto;
    padding:10px;
}

#gameBoard{
    position:relative;

    width:min(620px,90vw);
    aspect-ratio:1;

    background:rgba(5,10,25,.88);

    border:1px solid #293656;
    border-radius:20px;

    box-shadow:
    0 20px 60px rgba(0,0,0,.45);

    user-select:none;
    touch-action:none;
}


/* DOT */

.dot{
    position:absolute;

    width:15px;
    height:15px;

    border-radius:50%;

    background:#fff;

    transform:translate(-50%,-50%);

    z-index:10;

    box-shadow:
    0 0 10px rgba(255,255,255,.8);
}


/* LINE */

.line{
    position:absolute;

    background:#35415f;

    border-radius:10px;

    z-index:5;

    cursor:pointer;

    transition:.15s;
}

.line:hover{
    background:#20d9ff;

    box-shadow:
    0 0 14px rgba(32,217,255,.6);
}

.line.p1{
    background:#20d9ff;

    box-shadow:
    0 0 10px rgba(32,217,255,.5);

    cursor:default;
}

.line.p2{
    background:#ff58b2;

    box-shadow:
    0 0 10px rgba(255,88,178,.5);

    cursor:default;
}

.horizontal{
    height:9px;
}

.vertical{
    width:9px;
}


/* BOX */

.box{
    position:absolute;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:8px;

    font-size:25px;
    font-weight:bold;

    z-index:2;
}

.box.p1{
    color:#20d9ff;
    background:rgba(32,217,255,.15);
}

.box.p2{
    color:#ff58b2;
    background:rgba(255,88,178,.15);
}


/* BOTTOM */

.result{
    text-align:center;
    margin-top:18px;

    font-size:24px;
    font-weight:bold;

    color:#ffd45c;
}

.back-btn{
    display:block;
    margin:18px auto;

    padding:13px 25px;

    border:0;
    border-radius:11px;

    color:#fff;
    background:#273452;

    cursor:pointer;
}


@media(max-width:800px){

    body{
        padding:15px;
    }

    .setup{
        grid-template-columns:1fr;
    }

    .online-row{
        grid-template-columns:1fr;
    }

    .header h1{
        font-size:32px;
    }

}
</style>
</head>


<body>

<div class="container">

<div class="header">

<h1>DOTS BATTLE</h1>

<p>Classic strategy • Online multiplayer</p>

</div>


<!-- ================= SETUP ================= -->

<div id="setupScreen">

<div class="setup">


<!-- PLAYER 1 -->

<div class="card player1">

<h2>🔵 PLAYER 1</h2>

<input
    id="player1Name"
    type="text"
    placeholder="Enter your name"
>

</div>


<!-- BOARD SIZE -->

<div class="card">

<h2>SELECT BOARD SIZE</h2>

<div class="board-options">

<button
    type="button"
    class="size-btn"
    data-size="3"
>
    3 × 3
    <small>4 Boxes</small>
</button>

<button
    type="button"
    class="size-btn selected"
    data-size="4"
>
    4 × 4
    <small>9 Boxes</small>
</button>

<button
    type="button"
    class="size-btn"
    data-size="5"
>
    5 × 5
    <small>16 Boxes</small>
</button>

<button
    type="button"
    class="size-btn"
    data-size="6"
>
    6 × 6
    <small>25 Boxes</small>
</button>

</div>

</div>


<!-- PLAYER 2 -->

<div class="card player2">

<h2>💗 PLAYER 2</h2>

<input
    id="player2Name"
    type="text"
    placeholder="Friend's name"
>

</div>

</div>


<!-- ONLINE -->

<div class="card online">

<h2>🌐 PLAY ONLINE</h2>

<p>
Create a room and send the code to your friend.
</p>

<div class="online-row">

<button
    type="button"
    class="btn create-btn"
    id="createRoom"
>
CREATE ROOM
</button>

<input
    id="roomInput"
    type="text"
    placeholder="Enter room code"
>

<button
    type="button"
    class="btn join-btn"
    id="joinRoom"
>
JOIN
</button>

</div>

<div
    class="status"
    id="status"
></div>

</div>

</div>


<!-- ================= GAME ================= -->

<div
    id="gameScreen"
    class="game"
>

<div class="game-header">

<div class="room">

ROOM:
<span id="roomDisplay"></span>

</div>


<div
    class="turn"
    id="turnDisplay"
>
Waiting...
</div>


<div class="players">

<div class="player-score p1-score">

🔵
<span id="p1Display">
Player 1
</span>

:
<span id="p1Score">
0
</span>

</div>


<div class="player-score p2-score">

💗
<span id="p2Display">
Player 2
</span>

:
<span id="p2Score">
0
</span>

</div>

</div>

</div>


<div class="board-area">

<div id="gameBoard"></div>

</div>


<div
    class="result"
    id="result"
></div>


<button
    type="button"
    class="back-btn"
    id="backHome"
>
BACK TO HOME
</button>

</div>

</div>


<script>

/* =====================================================
   IMPORTANT:
   Ye version pehle LOCAL game ko 100% working rakhta hai.
   Online Firebase part neeche hai.
===================================================== */


/* ================= VARIABLES ================= */

let selectedSize = 4;

let roomCode = "";

let myPlayer = "";

let game = null;

let firebaseLoaded = false;


/* ================= SIZE BUTTONS ================= */

const sizeButtons =
document.querySelectorAll(".size-btn");


sizeButtons.forEach(button => {

    button.addEventListener("click", function(){

        sizeButtons.forEach(btn => {

            btn.classList.remove("selected");

        });

        this.classList.add("selected");

        selectedSize =
        Number(this.dataset.size);

        document.getElementById("status")
        .textContent =
        "Selected: " +
        selectedSize +
        " × " +
        selectedSize;

    });

});


/* ================= FIREBASE LOAD ================= */

const firebaseScript =
document.createElement("script");

firebaseScript.src =
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js";

firebaseScript.onload = () => {

    const databaseScript =
    document.createElement("script");

    databaseScript.src =
    "https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js";

    databaseScript.onload = () => {

        firebaseLoaded = true;

        initializeFirebase();

    };

    document.head.appendChild(databaseScript);

};

document.head.appendChild(firebaseScript);


/* ================= FIREBASE ================= */

let db = null;


function initializeFirebase(){

    const firebaseConfig = {

        apiKey:
        "AIzaSyDBcTvM0MIhmKwx8x57QvGNWWhY1px8",

        authDomain:
        "dots-and-boxes-60439.firebaseapp.com",

        databaseURL:
        "https://dots-and-boxes-60439-default-rtdb.firebaseio.com",

        projectId:
        "dots-and-boxes-60439",

        storageBucket:
        "dots-and-boxes-60439.firebasestorage.app",

        messagingSenderId:
        "435400230088",

        appId:
        "1:435400230088:web:834195f25c120b698911fd"

    };


    firebase.initializeApp(firebaseConfig);

    db = firebase.database();

}


/* ================= CREATE ROOM ================= */

document
.getElementById("createRoom")
.addEventListener("click", async function(){

    const name =
    document.getElementById("player1Name")
    .value
    .trim();


    if(!name){

        document.getElementById("status")
        .textContent =
        "⚠️ Player 1 ka naam enter karo.";

        return;

    }


    if(!firebaseLoaded){

        document.getElementById("status")
        .textContent =
        "⏳ Firebase loading... 1 second wait karo.";

        return;

    }


    roomCode =
    Math.random()
    .toString(36)
    .substring(2,8)
    .toUpperCase();


    myPlayer = "p1";


    game = {

        size:selectedSize,

        players:{
            p1:name,
            p2:""
        },

        scores:{
            p1:0,
            p2:0
        },

        turn:"p1",

        lines:{},

        boxes:{},

        finished:false

    };


    try{

        await db
        .ref("rooms/"+roomCode)
        .set(game);


        openGame();

        listenRoom();

    }
    catch(error){

        console.error(error);

        document.getElementById("status")
        .textContent =
        "❌ Room create error.";

    }

});


/* ================= JOIN ROOM ================= */

document
.getElementById("joinRoom")
.addEventListener("click", async function(){

    const code =
    document.getElementById("roomInput")
    .value
    .trim()
    .toUpperCase();


    const name =
    document.getElementById("player2Name")
    .value
    .trim();


    if(!code){

        document.getElementById("status")
        .textContent =
        "⚠️ Room code enter karo.";

        return;

    }


    if(!name){

        document.getElementById("status")
        .textContent =
        "⚠️ Player 2 ka naam enter karo.";

        return;

    }


    if(!firebaseLoaded){

        document.getElementById("status")
        .textContent =
        "⏳ Firebase loading...";

        return;

    }


    try{

        const snapshot =
        await db
        .ref("rooms/"+code)
        .once("value");


        if(!snapshot.exists()){

            document.getElementById("status")
            .textContent =
            "❌ Room nahi mila.";

            return;

        }


        const data =
        snapshot.val();


        if(data.players.p2){

            document.getElementById("status")
            .textContent =
            "❌ Room already full hai.";

            return;

        }


        roomCode = code;

        myPlayer = "p2";


        await db
        .ref(
            "rooms/"+roomCode+
            "/players/p2"
        )
        .set(name);


        openGame();

        listenRoom();

    }
    catch(error){

        console.error(error);

        document.getElementById("status")
        .textContent =
        "❌ Join error.";

    }

});


/* ================= OPEN GAME ================= */

function openGame(){

    document
    .getElementById("setupScreen")
    .style.display =
    "none";


    document
    .getElementById("gameScreen")
    .style.display =
    "block";


    document
    .getElementById("roomDisplay")
    .textContent =
    roomCode;

}


/* ================= LISTEN ================= */

function listenRoom(){

    db
    .ref("rooms/"+roomCode)
    .on("value", snapshot => {

        if(!snapshot.exists()){

            return;

        }


        game =
        snapshot.val();


        renderGame();

    });

}


/* ================= RENDER ================= */

function renderGame(){

    document
    .getElementById("p1Display")
    .textContent =
    game.players.p1;


    document
    .getElementById("p2Display")
    .textContent =
    game.players.p2 ||
    "Waiting...";


    document
    .getElementById("p1Score")
    .textContent =
    game.scores.p1;


    document
    .getElementById("p2Score")
    .textContent =
    game.scores.p2;


    if(!game.players.p2){

        document
        .getElementById("turnDisplay")
        .textContent =
        "⏳ Waiting for Player 2...";

    }

    else if(game.finished){

        showWinner();

    }

    else if(game.turn === myPlayer){

        document
        .getElementById("turnDisplay")
        .textContent =
        "🟢 YOUR TURN";

    }

    else{

        const name =
        game.turn === "p1"
        ? game.players.p1
        : game.players.p2;


        document
        .getElementById("turnDisplay")
        .textContent =
        "🔴 "+name+"'S TURN";

    }


    drawBoard();

}


/* ================= DRAW BOARD ================= */

function drawBoard(){

    const board =
    document.getElementById("gameBoard");


    board.innerHTML = "";


    const n =
    Number(game.size);


    const width =
    Math.min(
        600,
        window.innerWidth - 50
    );


    const gap =
    width / (n-1);


    board.style.width =
    width+"px";


    board.style.height =
    width+"px";


    /* ================= BOXES ================= */

    if(game.boxes){

        Object.keys(game.boxes)
        .forEach(key => {

            const parts =
            key.split("_");


            const r =
            Number(parts[0]);


            const c =
            Number(parts[1]);


            const box =
            document.createElement("div");


            box.className =
            "box "+
            game.boxes[key];


            box.style.left =
            (c*gap+8)+"px";


            box.style.top =
            (r*gap+8)+"px";


            box.style.width =
            (gap-16)+"px";


            box.style.height =
            (gap-16)+"px";


            const owner =
            game.boxes[key];


            const playerName =
            owner === "p1"
            ? game.players.p1
            : game.players.p2;


            box.textContent =
            playerName
            ? playerName.charAt(0).toUpperCase()
            : "";


            board.appendChild(box);

        });

    }


    /* ================= HORIZONTAL ================= */

    for(let r=0;r<n;r++){

        for(let c=0;c<n-1;c++){

            const key =
            "h_"+r+"_"+c;


            createLine(
                key,
                c*gap,
                r*gap-4,
                gap,
                9,
                "horizontal"
            );

        }

    }


    /* ================= VERTICAL ================= */

    for(let r=0;r<n-1;r++){

        for(let c=0;c<n;c++){

            const key =
            "v_"+r+"_"+c;


            createLine(
                key,
                c*gap-4,
                r*gap,
                9,
                gap,
                "vertical"
            );

        }

    }


    /* ================= DOTS ================= */

    for(let r=0;r<n;r++){

        for(let c=0;c<n;c++){

            const dot =
            document.createElement("div");


            dot.className =
            "dot";


            dot.style.left =
            c*gap+"px";


            dot.style.top =
            r*gap+"px";


            board.appendChild(dot);

        }

    }

}


/* ================= CREATE LINE ================= */

function createLine(
    key,
    left,
    top,
    width,
    height,
    type
){

    const line =
    document.createElement("div");


    line.className =
    "line "+type;


    line.style.left =
    left+"px";


    line.style.top =
    top+"px";


    line.style.width =
    width+"px";


    line.style.height =
    height+"px";


    if(game.lines &&
       game.lines[key]){

        line.classList.add(
            game.lines[key]
        );

    }

    else{

        line.addEventListener(
            "click",
            function(){

                makeMove(key);

            }
        );

    }


    document
    .getElementById("gameBoard")
    .appendChild(line);

}


/* ================= MAKE MOVE ================= */

async function makeMove(key){

    if(!game) return;


    if(!game.players.p2) return;


    if(game.finished) return;


    /* ONLY CURRENT PLAYER */

    if(game.turn !== myPlayer){

        return;

    }


    /* LINE ALREADY USED */

    if(game.lines &&
       game.lines[key]){

        return;

    }


    const roomRef =
    db.ref("rooms/"+roomCode);


    await roomRef.transaction(
    function(current){

        if(!current) return current;


        /* SERVER-SIDE TURN CHECK */

        if(current.turn !== myPlayer){

            return;

        }


        if(current.finished){

            return;

        }


        if(!current.lines){

            current.lines = {};

        }


        if(current.lines[key]){

            return;

        }


        if(!current.boxes){

            current.boxes = {};

        }


        if(!current.scores){

            current.scores = {
                p1:0,
                p2:0
            };

        }


        /* DRAW LINE */

        current.lines[key] =
        myPlayer;


        let boxesMade = 0;


        const n =
        Number(current.size);


        /* CHECK ALL BOXES */

        for(let r=0;r<n-1;r++){

            for(let c=0;c<n-1;c++){

                const boxKey =
                r+"_"+c;


                if(current.boxes[boxKey]){

                    continue;

                }


                const top =
                "h_"+r+"_"+c;


                const bottom =
                "h_"+(r+1)+"_"+c;


                const left =
                "v_"+r+"_"+c;


                const right =
                "v_"+r+"_"+(c+1);


                if(
                    current.lines[top] &&
                    current.lines[bottom] &&
                    current.lines[left] &&
                    current.lines[right]
                ){

                    current.boxes[boxKey] =
                    myPlayer;


                    current.scores[myPlayer]++;


                    boxesMade++;

                }

            }

        }


        /* ================= TURN LOGIC ================= */


        /*
            Box bana:
            same player ka turn.

            Box nahi bana:
            opponent ka turn.
        */

        if(boxesMade === 0){

            current.turn =
            myPlayer === "p1"
            ? "p2"
            : "p1";

        }


        /* ================= FINISH ================= */

        const totalBoxes =
        Object.keys(
            current.boxes
        ).length;


        const requiredBoxes =
        (n-1)*(n-1);


        if(
            totalBoxes >=
            requiredBoxes
        ){

            current.finished =
            true;

            current.turn =
            "";

        }


        return current;

    });

}


/* ================= WINNER ================= */

function showWinner(){

    let text = "";


    if(
        game.scores.p1 >
        game.scores.p2
    ){

        text =
        "🏆 "+
        game.players.p1+
        " WINS!";

    }

    else if(
        game.scores.p2 >
        game.scores.p1
    ){

        text =
        "🏆 "+
        game.players.p2+
        " WINS!";

    }

    else{

        text =
        "🤝 DRAW!";

    }


    document
    .getElementById("result")
    .textContent =
    text;


    document
    .getElementById("turnDisplay")

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dots Battle - Online</title>

<script src="https://www.gstatic.com/firebasejs/12.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.7.1/firebase-database-compat.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#111827,#312e81,#111827);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:95%;
    max-width:850px;
    text-align:center;
}

h1{
    font-size:42px;
    margin-bottom:5px;
}

.subtitle{
    color:#cbd5e1;
    margin-bottom:25px;
}

.card{
    background:rgba(15,23,42,.92);
    border:1px solid #475569;
    border-radius:20px;
    padding:25px;
    margin-bottom:20px;
}

input{
    width:100%;
    max-width:350px;
    padding:14px;
    margin:8px;
    border-radius:10px;
    border:1px solid #475569;
    background:#020617;
    color:white;
    font-size:16px;
}

button{
    padding:13px 22px;
    margin:8px;
    border:0;
    border-radius:10px;
    background:linear-gradient(90deg,#2563eb,#9333ea);
    color:white;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:.85;
}

#game{
    display:none;
}

.players{
    display:flex;
    justify-content:space-around;
    margin-bottom:20px;
    font-size:20px;
}

.p1{
    color:#38bdf8;
}

.p2{
    color:#f472b6;
}

#status{
    margin:15px;
    font-size:20px;
    font-weight:bold;
}

#board{
    display:grid;
    grid-template-columns:repeat(5,70px);
    grid-template-rows:repeat(5,70px);
    justify-content:center;
    margin:25px auto;
}

.dot{
    width:18px;
    height:18px;
    background:white;
    border-radius:50%;
    position:absolute;
    z-index:3;
}

.point{
    position:relative;
    width:70px;
    height:70px;
}

.line{
    position:absolute;
    background:#38bdf8;
    cursor:pointer;
    z-index:1;
}

.hline{
    width:52px;
    height:7px;
    left:9px;
    top:32px;
    border-radius:5px;
}

.vline{
    width:7px;
    height:52px;
    left:32px;
    top:9px;
    border-radius:5px;
}

.box{
    position:absolute;
    width:55px;
    height:55px;
    left:7px;
    top:7px;
    border-radius:8px;
    opacity:.35;
}

.room{
    font-size:22px;
    color:#facc15;
    font-weight:bold;
    margin:10px;
}

.hidden{
    display:none;
}

@media(max-width:600px){
    #board{
        grid-template-columns:repeat(5,55px);
        grid-template-rows:repeat(5,55px);
    }

    .point{
        width:55px;
        height:55px;
    }

    .hline{
        width:40px;
        left:8px;
        top:25px;
    }

    .vline{
        height:40px;
        left:25px;
        top:8px;
    }

    h1{
        font-size:32px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🎮 Dots Battle</h1>
<div class="subtitle">Classic Dots & Boxes — Play Online</div>

<div id="lobby" class="card">

    <input id="name" placeholder="Enter your name">

    <br>

    <button onclick="createRoom()">CREATE ROOM</button>

    <br>

    <input id="roomCode" placeholder="Enter Room Code">

    <br>

    <button onclick="joinRoom()">JOIN ROOM</button>

    <div id="message"></div>

</div>

<div id="game" class="card">

    <div class="room">
        Room: <span id="roomDisplay"></span>
    </div>

    <div class="players">
        <div class="p1">
            🔵 <span id="player1">Player 1</span>
            <br>
            Score: <span id="score1">0</span>
        </div>

        <div class="p2">
            🩷 <span id="player2">Waiting...</span>
            <br>
            Score: <span id="score2">0</span>
        </div>
    </div>

    <div id="status">Waiting for player 2...</div>

    <div id="board"></div>

    <button onclick="location.reload()">EXIT GAME</button>

</div>

</div>

<script>

// ================= FIREBASE =================

const firebaseConfig = {
    apiKey: "AIzaSyDBcTvTDmMOMIhmKwx8x57QvGNWWhYlpx8",
    authDomain: "dots-and-boxes-60439.firebaseapp.com",
    databaseURL: "https://dots-and-boxes-60439-default-rtdb.firebaseio.com",
    projectId: "dots-and-boxes-60439",
    storageBucket: "dots-and-boxes-60439.firebasestorage.app",
    messagingSenderId: "435400230088",
    appId: "1:435400230088:web:834195f25c120b698911fd"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


// ================= GAME VARIABLES =================

let room = "";
let myPlayer = "";
let myName = "";

const SIZE = 4; // 4x4 dots = 3x3 boxes

let gameData = null;


// ================= CREATE ROOM =================

function createRoom(){

    myName = document.getElementById("name").value.trim();

    if(!myName){
        alert("Pehle apna naam enter karo.");
        return;
    }

    room = Math.random().toString(36).substring(2,8).toUpperCase();

    myPlayer = "player1";

    const data = {
        player1:{
            name:myName,
            score:0
        },
        player2:null,

        turn:"player1",

        horizontal:{},
        vertical:{},

        boxes:{},

        started:false,
        winner:null
    };

    db.ref("rooms/"+room).set(data);

    openGame();

    listenRoom();

    alert("Room ban gaya!\nRoom Code: "+room+
          "\n\nYe code apne friend ko bhejo.");
}


// ================= JOIN ROOM =================

function joinRoom(){

    myName = document.getElementById("name").value.trim();
    const code = document.getElementById("roomCode").value.trim().toUpperCase();

    if(!myName){
        alert("Pehle apna naam enter karo.");
        return;
    }

    if(!code){
        alert("Room Code enter karo.");
        return;
    }

    room = code;
    myPlayer = "player2";

    db.ref("rooms/"+room).once("value").then(snapshot=>{

        if(!snapshot.exists()){
            alert("Room nahi mila.");
            return;
        }

        const data = snapshot.val();

        if(data.player2){
            alert("Room already full hai.");
            return;
        }

        db.ref("rooms/"+room+"/player2").set({
            name:myName,
            score:0
        });

        db.ref("rooms/"+room+"/started").set(true);

        openGame();

        listenRoom();

    });

}


// ================= OPEN GAME =================

function openGame(){

    document.getElementById("lobby").style.display="none";
    document.getElementById("game").style.display="block";

    document.getElementById("roomDisplay").innerText=room;

    createBoard();

}


// ================= LISTEN FIREBASE =================

function listenRoom(){

    db.ref("rooms/"+room).on("value",snapshot=>{

        if(!snapshot.exists()) return;

        gameData=snapshot.val();

        updateGame();

    });

}


// ================= UPDATE GAME =================

function updateGame(){

    if(!gameData) return;

    document.getElementById("player1").innerText =
        gameData.player1?.name || "Player 1";

    document.getElementById("score1").innerText =
        gameData.player1?.score || 0;

    document.getElementById("player2").innerText =
        gameData.player2?.name || "Waiting...";

    document.getElementById("score2").innerText =
        gameData.player2?.score || 0;


    if(!gameData.player2){

        document.getElementById("status").innerText =
            "⏳ Waiting for Player 2...";

    }else{

        if(gameData.winner){

            document.getElementById("status").innerText =
                "🏆 "+gameData.winner+" WINS!";

        }else{

            const turnName =
                gameData[gameData.turn]?.name || "Player";

            if(gameData.turn===myPlayer){

                document.getElementById("status").innerText =
                    "🔥 Your Turn!";

            }else{

                document.getElementById("status").innerText =
                    "⏳ "+turnName+"'s Turn";

            }
        }

    }

    drawBoard();

}


// ================= CREATE BOARD =================

function createBoard(){

    const board=document.getElementById("board");

    board.innerHTML="";

    for(let r=0;r<SIZE;r++){

        for(let c=0;c<SIZE;c++){

            const point=document.createElement("div");

            point.className="point";

            const dot=document.createElement("div");

            dot.className="dot";

            dot.style.left="26px";
            dot.style.top="26px";

            point.appendChild(dot);

            board.appendChild(point);

        }

    }

    drawBoard();
}


// ================= DRAW BOARD =================

function drawBoard(){

    const points=document.querySelectorAll(".point");

    if(!points.length) return;

    points.forEach(p=>{
        p.querySelectorAll(".line,.box").forEach(x=>x.remove());
    });


    // Horizontal lines

    for(let r=0;r<SIZE;r++){

        for(let c=0;c<SIZE-1;c++){

            const key=r+"_"+c;

            if(gameData?.horizontal?.[key]){

                const line=document.createElement("div");

                line.className="line hline";

                line.style.background =
                    gameData.horizontal[key]==="player1"
                    ? "#38bdf8"
                    : "#f472b6";

                points[r*SIZE+c].appendChild(line);

            }else{

                const line=document.createElement("div");

                line.className="line hline";

                line.style.background="#475569";

                line.onclick=()=>makeMove("horizontal",key);

                points[r*SIZE+c].appendChild(line);

            }

        }

    }


    // Vertical lines

    for(let r=0;r<SIZE-1;r++){

        for(let c=0;c<SIZE;c++){

            const key=r+"_"+c;

            if(gameData?.vertical?.[key]){

                const line=document.createElement("div");

                line.className="line vline";

                line.style.background =
                    gameData.vertical[key]==="player1"
                    ? "#38bdf8"
                    : "#f472b6";

                points[r*SIZE+c].appendChild(line);

            }else{

                const line=document.createElement("div");

                line.className="line vline";

                line.style.background="#475569";

                line.onclick=()=>makeMove("vertical",key);

                points[r*SIZE+c].appendChild(line);

            }

        }

    }

}


// ================= MAKE MOVE =================

function makeMove(type,key){

    if(!gameData) return;

    if(!gameData.player2) return;

    if(gameData.winner) return;

    if(gameData.turn!==myPlayer){

        alert("Abhi tumhari turn nahi hai.");

        return;
    }

    if(gameData[type]?.[key]) return;


    const updates={};

    updates["rooms/"+room+"/"+type+"/"+key]=myPlayer;

    db.ref().update(updates).then(()=>{

        checkBoxes(type,key);

    });

}


// ================= CHECK BOXES =================

function checkBoxes(type,key){

    setTimeout(()=>{

        db.ref("rooms/"+room).once("value").then(snapshot=>{

            const data=snapshot.val();

            let gotBox=false;

            for(let r=0;r<SIZE-1;r++){

                for(let c=0;c<SIZE-1;c++){

                    const boxKey=r+"_"+c;

                    if(data.boxes?.[boxKey]) continue;


                    const top =
                        data.horizontal?.[r+"_"+c];

                    const bottom =
                        data.horizontal?.[(r+1)+"_"+c];

                    const left =
                        data.vertical?.[r+"_"+c];

                    const right =
                        data.vertical?.[r+"_"+(c+1)];


                    if(top && bottom && left && right){

                        gotBox=true;

                        const updates={};

                        updates["boxes/"+boxKey]=myPlayer;

                        updates[myPlayer+"/score"] =
                            (data[myPlayer]?.score || 0)+1;

                        db.ref("rooms/"+room).update(updates);

                    }

                }

            }


            // If no box, change turn

            if(!gotBox){

                const next =
                    data.turn==="player1"
                    ? "player2"
                    : "player1";

                db.ref("rooms/"+room+"/turn").set(next);

            }

            checkWinner();

        });

    },300);

}


// ================= WINNER =================

function checkWinner(){

    db.ref("rooms/"+room).once("value").then(snapshot=>{

        const data=snapshot.val();

        const totalBoxes=(SIZE-1)*(SIZE-1);

        const score1=data.player1?.score || 0;
        const score2=data.player2?.score || 0;

        if(score1+score2>=totalBoxes){

            let winner;

            if(score1>score2){
                winner=data.player1.name;
            }else if(score2>score1){
                winner=data.player2.name;
            }else{
                winner="DRAW";
            }

            db.ref("rooms/"+room+"/winner").set(winner);

        }

    });

}

</script>

</body>
</html>
